<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:JK;font-weight:700;src:url('file:///Users/vickyjunior/projects/vdm/nse-academy/nse-academy-mobile/assets/fonts/PlusJakartaSans-700.ttf')}
@font-face{font-family:JK;font-weight:800;src:url('file:///Users/vickyjunior/projects/vdm/nse-academy/nse-academy-mobile/assets/fonts/PlusJakartaSans-800.ttf')}
@font-face{font-family:IN;font-weight:500;src:url('file:///Users/vickyjunior/projects/vdm/nse-academy/nse-academy-mobile/assets/fonts/Inter-500.ttf')}
*{box-sizing:border-box;margin:0}
html,body{width:4096px;height:2304px;overflow:hidden}
body{background:#0b1220;position:relative;font-family:IN,sans-serif}
.glow{position:absolute;inset:0;background:
 radial-gradient(1500px 1000px at 50% 44%, rgba(20,184,166,.20), transparent 70%),
 radial-gradient(1800px 1200px at 85% 110%, rgba(45,212,191,.10), transparent 70%),
 linear-gradient(180deg,#0b1220 0%,#0f1a2e 100%)}
/* faint, oversized rings echoing the logo, kept far outside the safe area */
.ring{position:absolute;border-radius:50%;border:26px solid rgba(241,245,249,.05)}
.r1{width:1700px;height:1700px;left:-520px;top:640px}
.r2{width:1700px;height:1700px;left:-60px;top:640px;border-color:rgba(45,212,191,.07)}
.r3{width:1300px;height:1300px;right:-380px;top:-420px;border-color:rgba(45,212,191,.06)}
.stage{position:absolute;left:0;right:0;top:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding-bottom:60px}
.lockup{display:flex;align-items:center;gap:110px}
svg{width:640px;height:480px;flex:none}
.word{font-family:JK;font-weight:800;font-size:340px;line-height:.98;letter-spacing:-6px;color:#f1f5f9;white-space:nowrap}
.word b{color:#2dd4bf;font-weight:800}
.rule{width:420px;height:14px;border-radius:7px;background:linear-gradient(90deg,#2dd4bf,#14b8a6);margin:90px 0 76px}
.tag{font-family:IN;font-weight:500;font-size:112px;letter-spacing:4px;color:#94a3b8}
</style></head><body>
<div class="glow"></div><div class="ring r1"></div><div class="ring r2"></div><div class="ring r3"></div>
<div class="stage">
 <div class="lockup">
  <svg viewBox="0 0 32 24" fill="none" stroke-width="3.4"><defs><linearGradient id="t" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2dd4bf"/><stop offset="1" stop-color="#14b8a6"/></linearGradient></defs>
   <circle cx="10" cy="12" r="7.2" stroke="url(#t)"/><circle cx="22" cy="12" r="7.2" stroke="#f1f5f9"/></svg>
  <div class="word">Infinity<br><b>Digital</b> Works</div>
 </div>
 <div class="rule"></div>
 <div class="tag">Apps and web solutions, built in Nairobi</div>
</div>
</body></html>
